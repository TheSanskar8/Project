<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech-to-Text Pad</title>
  <!-- Modern Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎤 Speech-to-Text Pad</h1>

    <div class="buttons">
      <button id="startBtn" class="btn start">Start Listening</button>
      <button id="stopBtn" class="btn stop" disabled>Stop Listening</button>
      <button id="saveBtn" class="btn save">Save Note</button>
    </div>
    
    <textarea id="speechText" placeholder="Your speech will appear here..."></textarea>
    
    <h2>Saved Notes</h2>
    <ul id="notesList" class="notes"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
